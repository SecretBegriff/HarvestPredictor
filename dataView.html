

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Visualization</title>
    <link rel="stylesheet" href="dataView.css">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/fonts/transformations.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="sidebar-style.css">
</head>
<body>
    <div class="wrapper">
        <aside id="sidebar">
            <div class="d-flex justify-content-between p-4">
                <div class="sidebar-logo">
                    <i class='bx bx-plant-pot bx-lg'></i>
                    <br> 
                    <a href="#">Harvest Predictor</a>
                </div>
                <button class="toggle-btn border-0" type="button"><i id="icon" class='bx  bx-chevrons-right bx-sm'></i> </button>
            </div>
            <ul class="sidebar-nav">
                <li class="sidebar-item">
                    <a href="/index.html" class="sidebar-link">
                        <i class='bx  bx-dashboard bx-sm'></i> 
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/WebPage/predictions.html" class="sidebar-link">
                        <i class='bx  bx-calendar-detail bx-sm'></i>
                        <span>Predictions</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/dataView.html" class="sidebar-link">
                        <i class='bx  bx-database bx-sm'></i>  
                        <span>Data Visualization</span>
                    </a>
                </li>
            </ul>
        </aside>

        <main>           
            <div class="heading">
                <h3>Live Monitoring</h1>
                <div class="live-dot"></div>
            </div>

            <div class="data-container">
                <div class="data-header">
                    <p>Plant</p>
                    <p>Humidity</p>
                    <p>Temperature</p>
                    <p>Timestamp</p>
                    <p>Sensor Status</p>
                </div>
                <div class="data-body">
                    <div class="data-row visible">
                        <p>Girasol</p>
                        <p>50.37%</p>
                        <p>35.9°C</p>
                        <p>23:22:12 <br> 12/09/2025</p>
                        <p>Active</p>
                    </div>
                    <div class="data-row visible">
                    </div>
                    <div class="data-row visible">
                    </div>
                    <div class="data-row visible">
                    </div>
                    <div class="data-row visible">
                    </div>
                </div>

                <div class="plant-titles">
                    <p>Plant Name</p>
                    <p>Planting Day</p> 
                    <p>Edit</p> 
                </div>

                <div class="plant-body">
                    <!-- JavaScript -->
                </div>
            </div>
        </main> 
    </div>

    <div class="plant-modal" id="plantModal">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Modify Plant</h5>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="plantName" class="form-label">Name</label>
                    <input type="text" class="form-control" id="plantName" placeholder="Enter plant name">
                </div>

                <div class="mb-3 form-group">
                    <h6 class="group-title">Optimal Temperature (°C)</h6>
                    <div class="input-group">
                        <div class="input-item">
                            <label for="plantOptimalTempMin" class="form-label">Minimum</label>
                            <input type="number" class="form-control" id="plantOptimalTempMin" rows="1" placeholder="Min Temp">
                        </div>
                        <div class="input-item">
                            <label for="plantOptimalTempMax" class="form-label">Maximum</label>
                            <input type="number" class="form-control" id="plantOptimalTempMax" rows="1" placeholder="Max Temp">
                        </div>
                    </div>
                </div>

                <div class="mb-3 form-group">
                    <h6 class="group-title">Optimal Humidity (%)</h6>
                    <div class="input-group">
                        <div class="input-item">
                            <label for="plantOptimalHumidityMin" class="form-label">Minimum</label>
                            <input type="number" class="form-control" id="plantOptimalHumidityMin" rows="1" placeholder="Min Humidity">
                        </div>
                        <div class="input-item">
                            <label for="plantOptimalHumidityMax" class="form-label">Maximum</label>
                            <input type="number" class="form-control" id="plantOptimalHumidityMax" rows="1" placeholder="Max Humidity">
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="averageHarvestDays" class="form-label">Avg Harvest Days</label>
                    <input type="number" class="form-control" id="averageHarvestDays" rows="1" placeholder="Enter days">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="closeplantModal">Cancel</button>
                <button type="button" class="btn btn-save" id="saveplant">Save</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="sidebar-script.js"></script>
    <script src="dataView.js"></script>
</body>
</html>
