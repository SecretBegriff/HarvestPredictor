<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Plant</title>
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/fonts/transformations.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="sidebar-style.css">
    <link rel="stylesheet" href="newPlant.css">
    <link rel="stylesheet" href="newPlantType.css">

</head>
<body>
    <div class="wrapper">
        <aside id="sidebar" class="expand">
            <div class="d-flex justify-content-between p-4">
                <div class="sidebar-logo">
                    <i class='bx bx-plant-pot bx-lg'></i>
                    <br> 
                    <a href="#">Harvest Predictor</a>
                </div>
                <button class="toggle-btn border-0" type="button"><i id="icon" class='bx  bx-chevrons-right bx-sm'></i> </button>
            </div>
            <ul class="sidebar-nav">
                <li class="sidebar-item">
                    <a href="/index.html" class="sidebar-link">
                        <i class='bx  bx-dashboard bx-sm'></i> 
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/WebPage/predictions.html" class="sidebar-link">
                        <i class='bx  bx-calendar-detail bx-sm'></i>
                        <span>Predictions</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/dataView.html" class="sidebar-link">
                        <i class='bx  bx-database bx-sm'></i>  
                        <span>Data Visualization</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="/phoneRegistration.html" class="sidebar-link">
                        <i class='bx  bx-phone bx-sm'></i>  
                        <span>Phone Registration</span>
                    </a>
                </li>
            </ul>
        </aside>
        <div class="main">
            <div class="form-container">
                <div class="back">
                    <a href="javascript:history.back()" class="btn btn-light"><i class='bx  bx-arrow-left-stroke bx-lg' id="arrow-back"></i></a>
                </div>
                <h1 class="form-header">New Plant</h1>
                
                <form id="formNewPlant">
                    <div class="form-section">
                        <div class="mb-3">
                            <label for="plantType" class="form-label">Plant Type</label>
                            <select class="form-select" id="plantType" required>
                                <option value="">Select a plant type</option>
                                <!-- Las opciones se llenarán dinámicamente con JavaScript -->
                            </select>
                            <div class="form-text">
                                Can't find your plant type? 
                                <a href="#" id="openPlantTypeModal" style="color: #005813; text-decoration: none;">
                                    <strong>Create a new one</strong>
                                </a>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="plantingDate" class="form-label">Planting date</label>
                            <input type="date" class="form-control" id="plantingDate" required>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="button" class="btn btn-secondary me-md-2" onclick="window.location.href='index.html';">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Plant</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal para Nuevo Tipo de Planta -->
<!-- Modal para nuevo tipo de planta -->
<div class="plant-type-modal" id="plantTypeModal">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">New Plant Type</h5>
        </div>
        <div class="modal-body">
            <div class="mb-3">
                <label for="plantTypeName" class="form-label">Plant Type Name</label>
                <input type="text" class="form-control" id="plantTypeName" placeholder="Enter plant type name" required>
            </div>
            <div class="mb-3">
                <label for="optimalTempMin" class="form-label">Minimum Optimal Temperature (°C)</label>
                <input type="number" class="form-control" id="optimalTempMin" placeholder="e.g., 18" step="0.1" required>
            </div>
            <div class="mb-3">
                <label for="optimalTempMax" class="form-label">Maximum Optimal Temperature (°C)</label>
                <input type="number" class="form-control" id="optimalTempMax" placeholder="e.g., 28" step="0.1" required>
            </div>
            <div class="mb-3">
                <label for="optimalHumidityMin" class="form-label">Minimum Optimal Humidity (%)</label>
                <input type="number" class="form-control" id="optimalHumidityMin" placeholder="e.g., 50" step="0.1" required>
            </div>
            <div class="mb-3">
                <label for="optimalHumidityMax" class="form-label">Maximum Optimal Humidity (%)</label>
                <input type="number" class="form-control" id="optimalHumidityMax" placeholder="e.g., 80" step="0.1" required>
            </div>
            <div class="mb-3">
                <label for="harvestDays" class="form-label">Average Harvest Days</label>
                <input type="number" class="form-control" id="harvestDays" placeholder="e.g., 60" required>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="closePlantTypeModal">Cancel</button>
            <button type="button" class="btn btn-save" id="savePlantType">Save Plant Type</button>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="sidebar-script.js"></script>
    <script src="newPlant.js"></script>
</body>
</html>
